name: Deploy Staging to VPS

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - name: Install PostgreSQL 17 client (psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            "Architectures: $(dpkg --print-architecture)" \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
          | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Push DB migrations (staging)
        continue-on-error: true  # Don't block deploy on Supabase transient errors (migrations are idempotent)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          # Retry helper — Supabase occasionally returns 500
          retry_psql() {
            for i in 1 2 3; do
              if PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
                -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
                -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
                "$@" 2>&1; then
                return 0
              fi
              echo "::warning::psql attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "::error::psql failed after 3 attempts — migrations skipped, deploy continues"
            return 1
          }
          # Ensure migration tracking table exists
          retry_psql -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version TEXT PRIMARY KEY);" || exit 0
          for f in supabase/migrations/*.sql; do
            ver=$(basename "$f" | cut -d_ -f1)
            exists=$(retry_psql -tA -c "SELECT version FROM supabase_migrations.schema_migrations WHERE version='$ver';" || echo "")
            if [ -z "$exists" ]; then
              echo "Applying: $ver"
              retry_psql -f "$f" -v ON_ERROR_STOP=1 || { echo "::warning::Failed to apply $ver, skipping"; continue; }
              retry_psql -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('$ver');" || echo "::warning::Failed to record $ver"
            else
              echo "Skipping: $ver (already applied)"
            fi
          done

      - name: Get applied migration version
        id: migration
        if: always()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          LATEST=$(PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
            -U "postgres.irmihumjlbckwygtnvfi" -d postgres -tA \
            -c "SELECT COALESCE(MAX(version), '0000') FROM supabase_migrations.schema_migrations;" 2>/dev/null || echo "0000")
          echo "LATEST=${LATEST:-0000}" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VALUE=S v${VER}-b${{ github.run_number }}/${{ steps.migration.outputs.LATEST }}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://irmihumjlbckwygtnvfi.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybWlodW1qbGJja3d5Z3RudmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDgzMTEsImV4cCI6MjA5NzcyNDMxMX0.5BqCxAjfJKRUHJkPE3OiwouuI1JxvyoD9SW2eVcDrMw"
          NEXT_PUBLIC_APP_ENV: "staging"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.VALUE }}
        run: npm run build

      - name: Rsync .next to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: .next/
          remote_path: /opt/questify-staging/.next
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Pull code + restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify-staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            cp -f deploy/nginx-questify-staging.conf /etc/nginx/sites-available/questify-staging
            ln -sf /etc/nginx/sites-available/questify-staging /etc/nginx/sites-enabled/questify-staging
            nginx -t && systemctl reload nginx || true
            pm2 delete questify-staging 2>/dev/null || true
            pm2 start npm --name questify-staging -- start
            pm2 save
            echo "=== Staging deploy complete ==="
            pm2 status

      - name: Smoke test
        if: always()
        run: |
          echo "::group::Smoke tests"
          sleep 5  # PM2 restart

          echo "1. Health check"
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://v881545.hosted-by-vdsina.com/api/telegram)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "   Health: HTTP $STATUS"

          echo "2. API response"
          BODY=$(curl -fsS https://v881545.hosted-by-vdsina.com/api/telegram)
          if ! echo "$BODY" | grep -q '"ok"'; then
            echo "::error::API response unexpected: $BODY"
            exit 1
          fi
          echo "   Response: $BODY"

          echo "3. Version"
          VER=$(curl -fsS https://v881545.hosted-by-vdsina.com | grep -oP 'S v[\d.]+-b\d+/\d+')
          if [ -z "$VER" ]; then
            echo "::warning::Version tag not found in HTML"
          else
            echo "   $VER"
          fi

          echo "4. pg_dump"
          pg_dump --version
          echo "::endgroup::"

      - name: Lighthouse CI
        if: always()
        continue-on-error: true
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun

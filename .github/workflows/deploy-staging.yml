name: Deploy Staging to VPS

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - name: Push DB migrations (staging)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # Ensure migration tracking table exists
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
            -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
            -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version TEXT PRIMARY KEY);"
          for f in supabase/migrations/*.sql; do
            ver=$(basename "$f" | cut -d_ -f1)
            exists=$(PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql -tA \
              -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
              -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
              -c "SELECT version FROM supabase_migrations.schema_migrations WHERE version='$ver';")
            if [ -z "$exists" ]; then
              echo "Applying: $ver"
              PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
                -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
                -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
                -f "$f" -v ON_ERROR_STOP=1
              PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
                -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
                -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
                -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('$ver');"
            else
              echo "Skipping: $ver (already applied)"
            fi
          done

      - name: Get version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VALUE=S v${VER}-b${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://irmihumjlbckwygtnvfi.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybWlodW1qbGJja3d5Z3RudmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDgzMTEsImV4cCI6MjA5NzcyNDMxMX0.5BqCxAjfJKRUHJkPE3OiwouuI1JxvyoD9SW2eVcDrMw"
          NEXT_PUBLIC_APP_ENV: "staging"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.VALUE }}
        run: npm run build

      - name: Rsync .next to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: .next/
          remote_path: /opt/questify-staging/.next
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Pull code + restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify-staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            cp -f deploy/nginx-questify-staging.conf /etc/nginx/sites-available/questify-staging
            ln -sf /etc/nginx/sites-available/questify-staging /etc/nginx/sites-enabled/questify-staging
            nginx -t && systemctl reload nginx || true
            pm2 delete questify-staging 2>/dev/null || true
            pm2 start npm --name questify-staging -- start
            pm2 save
            echo "=== Staging deploy complete ==="
            pm2 status

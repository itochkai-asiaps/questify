name: Deploy Staging to VPS

on:
  push:
    branches: [staging]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify-staging
            git pull origin staging
            rm -rf .next
            npm install
            echo "=== Stopping prod temporarily to free RAM ==="
            pm2 stop questify
            npm run build
            pm2 start questify
            pm2 restart questify-staging --update-env
            pm2 save
            echo "=== Staging deploy complete ==="
            pm2 status

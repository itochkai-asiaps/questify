name: Deploy Staging to VPS

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - name: Push DB migrations (staging)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          npx supabase db push \
            --db-url "postgresql://postgres.irmihumjlbckwygtnvfi:${SUPABASE_DB_PASSWORD}@aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres"

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://irmihumjlbckwygtnvfi.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlybWlodW1qbGJja3d5Z3RudmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDgzMTEsImV4cCI6MjA5NzcyNDMxMX0.5BqCxAjfJKRUHJkPE3OiwouuI1JxvyoD9SW2eVcDrMw"
          NEXT_PUBLIC_APP_ENV: "staging"
          NEXT_PUBLIC_APP_VERSION: "S v0.2-b${{ github.run_number }}"
        run: npm run build

      - name: Rsync .next to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: .next/
          remote_path: /opt/questify-staging/.next
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Pull code + restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify-staging
            git fetch origin staging
            git reset --hard origin/staging
            npm install
            cp -f deploy/nginx-questify-staging.conf /etc/nginx/sites-available/questify-staging
            ln -sf /etc/nginx/sites-available/questify-staging /etc/nginx/sites-enabled/questify-staging
            nginx -t && systemctl reload nginx || true
            pm2 delete questify-staging 2>/dev/null || true
            pm2 start npm --name questify-staging -- start
            pm2 save
            echo "=== Staging deploy complete ==="
            pm2 status

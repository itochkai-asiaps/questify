name: Weekly Staging DB Backup

on:
  schedule:
    - cron: "0 4 * * 0" # every Sunday at 04:00 UTC
  workflow_dispatch: # manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Dump staging DB
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          FILE="questify-staging-$(date -u +%Y%m%d-%H%M).dump"
          echo "BACKUP_FILE=$FILE" >> $GITHUB_ENV
          pg_dump \
            -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
            -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
            --no-owner --no-acl -Fc \
            -f "$FILE"

      - name: Upload to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://questify-backups/staging/$BACKUP_FILE" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1

      - name: Cleanup old staging backups (>30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          FILE_COUNT=$(aws s3 ls "s3://questify-backups/staging/" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1 \
            | wc -l)
          echo "Files in staging/: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "⚠️  Fewer than 2 backups — skipping cleanup (possible outage)"
            exit 0
          fi
          aws s3 ls "s3://questify-backups/staging/" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1 \
          | awk -v cutoff="$(date -d '30 days ago' +%Y-%m-%d)" '$1 < cutoff {print $4}' \
          | while read f; do
              echo "Deleting: staging/$f"
              aws s3 rm "s3://questify-backups/staging/$f" \
                --endpoint-url https://storage.yandexcloud.net \
                --region ru-central1
            done

name: Weekly Staging DB Backup

on:
  schedule:
    - cron: "0 4 * * 0" # every Sunday at 04:00 UTC
  workflow_dispatch: # manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client (pg_dump)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            "Architectures: $(dpkg --print-architecture)" \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
          | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_dump /usr/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_restore /usr/bin/pg_restore
          pg_dump --version

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Dump staging DB
        env:
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: |
          set -e
          FILE="questify-staging-$(date -u +%Y%m%d-%H%M).dump"
          echo "BACKUP_FILE=$FILE" >> $GITHUB_ENV
          echo "::group::Dumping staging DB to $FILE"
          for i in $(seq 1 3); do
            echo "pg_dump attempt $i/3..."
            if pg_dump \
              -h aws-1-ap-southeast-2.pooler.supabase.com -p 6543 \
              -U "postgres.irmihumjlbckwygtnvfi" -d postgres \
              --no-owner --no-acl -Fc \
              -f "$FILE"; then
              break
            fi
            echo "::warning::pg_dump attempt $i failed, retrying in 10s..."
            sleep 10
          done
          SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
          echo "Dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Dump too small (${SIZE} bytes) — likely failed"
            exit 1
          fi
          echo "::endgroup::"

      - name: Upload to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://questify-backups/$BACKUP_FILE" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1

      - name: Cleanup old staging backups (>30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
        run: |
          FILE_COUNT=$(aws s3 ls "s3://questify-backups/" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1 \
            | grep "questify-staging-" \
            | wc -l)
          echo "Staging backup files: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "⚠️  Fewer than 2 staging backups — skipping cleanup (possible outage)"
            exit 0
          fi
          aws s3 ls "s3://questify-backups/" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1 \
          | grep "questify-staging-" \
          | awk -v cutoff="$(date -d '30 days ago' +%Y-%m-%d)" '$1 < cutoff {print $4}' \
          | while read f; do
              echo "Deleting: $f"
              aws s3 rm "s3://questify-backups/$f" \
                --endpoint-url https://storage.yandexcloud.net \
                --region ru-central1
            done

name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify
            git pull origin master
            rm -rf .next
            npm ci --production=false 2>/dev/null || npm install
            echo "=== Building (this takes 2-5 min on 1GB VPS) ==="
            BUILD=$(git rev-list --count HEAD)
            export NEXT_PUBLIC_APP_VERSION="v0.2-b${BUILD}"
            npm run build
            # Update Nginx config from repo
            cp -f deploy/nginx-questify.conf /etc/nginx/sites-available/questify
            ln -sf /etc/nginx/sites-available/questify /etc/nginx/sites-enabled/questify
            nginx -t && systemctl reload nginx || true
            pm2 restart questify --update-env
            pm2 save
            echo "=== Deploy complete ==="
            pm2 status

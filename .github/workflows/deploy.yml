name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - name: Install PostgreSQL 17 client (psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            'Components: main' \
            "Architectures: $(dpkg --print-architecture)" \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
          | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Push DB migrations (prod)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h aws-1-ap-southeast-1.pooler.supabase.com -p 6543 \
            -U "postgres.zkifblsbwfllfmlndxjt" -d postgres \
            -c "CREATE SCHEMA IF NOT EXISTS supabase_migrations; CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (version TEXT PRIMARY KEY);"
          for f in supabase/migrations/*.sql; do
            ver=$(basename "$f" | cut -d_ -f1)
            exists=$(PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql -tA \
              -h aws-1-ap-southeast-1.pooler.supabase.com -p 6543 \
              -U "postgres.zkifblsbwfllfmlndxjt" -d postgres \
              -c "SELECT version FROM supabase_migrations.schema_migrations WHERE version='$ver';")
            if [ -z "$exists" ]; then
              echo "Applying: $ver"
              PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
                -h aws-1-ap-southeast-1.pooler.supabase.com -p 6543 \
                -U "postgres.zkifblsbwfllfmlndxjt" -d postgres \
                -f "$f" -v ON_ERROR_STOP=1
              PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
                -h aws-1-ap-southeast-1.pooler.supabase.com -p 6543 \
                -U "postgres.zkifblsbwfllfmlndxjt" -d postgres \
                -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('$ver');"
            else
              echo "Skipping: $ver (already applied)"
            fi
          done

      - name: Get applied migration version
        id: migration
        if: always()
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          LATEST=$(PGPASSWORD="${SUPABASE_DB_PASSWORD}" psql \
            -h aws-1-ap-southeast-1.pooler.supabase.com -p 6543 \
            -U "postgres.zkifblsbwfllfmlndxjt" -d postgres -tA \
            -c "SELECT COALESCE(MAX(version), '0000') FROM supabase_migrations.schema_migrations;" 2>/dev/null || echo "0000")
          echo "LATEST=${LATEST:-0000}" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "VALUE=v${VER}-b${{ github.run_number }}/${{ steps.migration.outputs.LATEST }}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://zkifblsbwfllfmlndxjt.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_AbDJH5ukLh_Ea3p_LeQSww_7l4JzWQ6"
          NEXT_PUBLIC_APP_ENV: "production"
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.VALUE }}
        run: npm run build

      - name: Rsync .next to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: .next/
          remote_path: /opt/questify/.next
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull code + restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify
            git fetch origin master
            git reset --hard origin/master
            rm -rf node_modules
            npm install
            cp -f deploy/nginx-questify.conf /etc/nginx/sites-available/questify
            ln -sf /etc/nginx/sites-available/questify /etc/nginx/sites-enabled/questify
            nginx -t && systemctl reload nginx || true
            pm2 restart questify --update-env
            pm2 save
          echo "=== Deploy complete ==="
          pm2 status

      - name: Smoke test
        if: always()
        run: |
          echo "::group::Smoke tests"
          sleep 5  # PM2 restart

          echo "1. Health check"
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://v869487.hosted-by-vdsina.com/api/telegram)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "   Health: HTTP $STATUS"

          echo "2. API response"
          BODY=$(curl -fsS https://v869487.hosted-by-vdsina.com/api/telegram)
          if ! echo "$BODY" | grep -q '"ok"'; then
            echo "::error::API response unexpected: $BODY"
            exit 1
          fi
          echo "   Response: $BODY"

          echo "3. Version"
          VER=$(curl -fsS https://v869487.hosted-by-vdsina.com | grep -oP 'S v[\d.]+-b\d+/\d+')
          if [ -z "$VER" ]; then
            echo "::warning::Version tag not found in HTML"
          else
            echo "   $VER"
          fi

          echo "4. pg_dump"
          pg_dump --version
          echo "::endgroup::"

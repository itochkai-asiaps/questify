name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify
             # Prevent concurrent builds
            if [ -f /tmp/questify-build.lock ]; then
              echo "Another build in progress — waiting 30s..."
              sleep 30
              if [ -f /tmp/questify-build.lock ]; then
                echo "Build still locked — aborting. Push again."
                exit 1
              fi
            fi
            touch /tmp/questify-build.lock
            trap "rm -f /tmp/questify-build.lock" EXIT

            git pull origin master
            rm -rf .next node_modules/.cache
            npm ci --production=false 2>/dev/null || npm install
            echo "=== Building (this takes 2-5 min on 1GB VPS) ==="
            npm run build
            pm2 restart questify --update-env
            pm2 save
            echo "=== Deploy complete ==="
            pm2 status

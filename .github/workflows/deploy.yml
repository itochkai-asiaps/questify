name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://zkifblsbwfllfmlndxjt.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_AbDJH5ukLh_Ea3p_LeQSww_7l4JzWQ6"
          NEXT_PUBLIC_APP_ENV: "production"
          NEXT_PUBLIC_APP_VERSION: "v0.2-b${{ github.run_number }}"
        run: npm run build

      - name: Rsync .next to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: .next/
          remote_path: /opt/questify/.next
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull code + restart PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/questify
            git fetch origin master
            git reset --hard origin/master
            npm ci --production=false 2>/dev/null || npm install
            cp -f deploy/nginx-questify.conf /etc/nginx/sites-available/questify
            ln -sf /etc/nginx/sites-available/questify /etc/nginx/sites-enabled/questify
            nginx -t && systemctl reload nginx || true
            pm2 restart questify --update-env
            pm2 save
            echo "=== Deploy complete ==="
            pm2 status
